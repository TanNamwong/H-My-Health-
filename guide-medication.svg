#172f46" font-family="sans-serif">”</text><rect x="455" y="750" width="410" height="190" rx="25" fill="#e6f7e8" stroke="#d8e5ee" stroke-width="2"/><circle cx="505" cy="802" r="34" fill="#27a65a"/><text x="505" y="814" text-anchor="middle" font-size="36" font-weight="bold" fill="#fff" font-family="sans-serif">3</text><text x="555" y="811" font-size="25" font-weight="bold" fill="#172f46" font-family="sans-serif">ตรวจสอบประวัติการยืนยัน</text><rect x="455" y="1000" width="410" height="45" rx="18" fill="#1769aa"/><text x="660" y="1031" text-anchor="middle" font-size="22" fill="#fff" font-weight="bold" font-family="sans-serif">ใช้งานง่าย • ข้อมูลอยู่ในอุปกรณ์</text></svg>